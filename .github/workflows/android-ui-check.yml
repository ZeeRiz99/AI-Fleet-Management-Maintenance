# FleetLog AI: build the Android app, run it on a GitHub-hosted emulator and screenshot the "Ask FleetLog AI" flow
# against the live bot (https://fleetlog-ai.vercel.app). Screenshots are uploaded as the "ui-screenshots" artifact.
# Needs the repo secret FLEETLOG_APP_KEY (same value as OPS_APP_KEY on the server).
name: Android UI check

on:
  workflow_dispatch:
  push:
    branches: [feature/fleetlog-ai]
    paths:
      - ".github/workflows/android-ui-check.yml"
      - ".github/scripts/ui_check.sh"
      - "android/**"

permissions:
  contents: read

concurrency:
  group: android-ui-check
  cancel-in-progress: true

jobs:
  ui-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable KVM (hardware acceleration for the emulator)
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: App settings (the key comes from a secret and is never printed)
        env:
          APP_KEY: ${{ secrets.FLEETLOG_APP_KEY }}
        run: |
          test -n "$APP_KEY" || { echo "FLEETLOG_APP_KEY secret is missing"; exit 1; }
          printf 'sdk.dir=%s\nfleetlog.url=https://fleetlog-ai.vercel.app\nfleetlog.appKey=%s\n' "$ANDROID_HOME" "$APP_KEY" > local.properties

      - name: Unit tests + debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Run on the emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: android
          script: bash ../.github/scripts/ui_check.sh app/build/outputs/apk/debug/app-debug.apk ../ui-shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-shots/
          if-no-files-found: warn
